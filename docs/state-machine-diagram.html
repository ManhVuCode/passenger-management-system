<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>State Machine Diagram — GR2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f8f6f1; font-family:'Inter',sans-serif; padding:48px 56px; }
  h1  { font-size:28px; font-weight:300; color:#1a1814; letter-spacing:-0.02em; margin-bottom:6px; }
  .sub { font-family:'JetBrains Mono',monospace; font-size:11px; color:#9c9690; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:28px; }
  .legend { display:flex; gap:28px; align-items:center; margin-bottom:32px; padding:14px 24px; background:white; border:1px solid #e2ddd6; border-radius:10px; width:fit-content; flex-wrap:wrap; }
  .lg-row { display:flex; align-items:center; gap:9px; font-size:12px; color:#44403c; }
  .wrap { border:1px solid #d6d0c6; border-radius:16px; background:white; overflow-x:auto; box-shadow:0 4px 32px rgba(0,0,0,0.06); }
  svg text { font-family:'Inter',sans-serif; }
</style>
</head>
<body>

<h1>State Machine Diagram — GR2 Passenger Management System</h1>
<p class="sub">v1 · May 2026 · Trip · Round · AttendanceRecord · RoundPassengerAssignment</p>

<div class="legend">
  <div class="lg-row">
    <svg width="14" height="14"><circle cx="7" cy="7" r="7" fill="#1e293b"/></svg>
    Initial state
  </div>
  <div class="lg-row">
    <svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="none" stroke="#1e293b" stroke-width="2"/><circle cx="8" cy="8" r="4" fill="#1e293b"/></svg>
    Final state
  </div>
  <div class="lg-row">
    <svg width="80" height="28"><rect x="0" y="4" width="80" height="22" rx="11" fill="white" stroke="#2563eb" stroke-width="2"/><text x="40" y="19" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a" font-family="Inter,sans-serif">STATE</text></svg>
    State node
  </div>
  <div class="lg-row">
    <svg width="60" height="14"><line x1="0" y1="7" x2="52" y2="7" stroke="#374151" stroke-width="2" marker-end="url(#leg-arr)"/><defs><marker id="leg-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#374151"/></marker></defs></svg>
    Transition
  </div>
  <div style="width:1px;background:#e2ddd6;height:20px;"></div>
  <div class="lg-row">
    <svg width="60" height="14"><line x1="0" y1="7" x2="52" y2="7" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#leg-arr2)"/><defs><marker id="leg-arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#dc2626"/></marker></defs></svg>
    CANCELLED transition
  </div>
  <div class="lg-row">
    <svg width="60" height="14"><line x1="0" y1="7" x2="52" y2="7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#leg-arr3)"/><defs><marker id="leg-arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#f59e0b"/></marker></defs></svg>
    System cascade / auto-transition
  </div>
</div>

<div class="wrap">
<svg viewBox="0 0 2600 2100" xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;min-width:2400px;height:auto;">
<defs>
  <!-- standard arrow -->
  <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1,2 L11,6 L1,10 Z" fill="#374151"/>
  </marker>
  <!-- cancel arrow -->
  <marker id="arr-c" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1,2 L11,6 L1,10 Z" fill="#dc2626"/>
  </marker>
  <!-- cascade arrow -->
  <marker id="arr-cas" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1,2 L11,6 L1,10 Z" fill="#f59e0b"/>
  </marker>
  <!-- override arrow -->
  <marker id="arr-ov" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1,2 L11,6 L1,10 Z" fill="#9333ea"/>
  </marker>

  <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/></filter>

  <style>
    .sm-state  { font-size:15px; font-weight:700; }
    .sm-sub    { font-size:11px; fill:#6b7280; }
    .sm-guard  { font-size:12px; font-style:italic; }
    .sm-action { font-size:11px; font-family:'JetBrains Mono',monospace; }
    .sm-actor  { font-size:11px; font-weight:600; }
    .section-lbl { font-size:16px; font-weight:700; font-family:'JetBrains Mono',monospace; letter-spacing:0.04em; }
  </style>
</defs>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     SECTION 1 — TRIP STATE MACHINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

<rect x="40" y="40" width="1140" height="520" rx="16" fill="#f8faff" stroke="#bfdbfe" stroke-width="2"/>
<text x="80" y="82" class="section-lbl" fill="#1d4ed8">01  TRIP  —  status derived from Rounds</text>
<text x="80" y="104" class="sm-sub">Trip has no direct actor trigger — status is computed by System from Round states</text>

<!-- Initial dot -->
<circle cx="200" cy="200" r="14" fill="#1e293b"/>
<line x1="214" y1="200" x2="290" y2="200" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- PLANNED -->
<g filter="url(#sh)">
  <rect x="290" y="164" width="200" height="74" rx="36" fill="white" stroke="#64748b" stroke-width="2.5"/>
  <text x="390" y="196" text-anchor="middle" class="sm-state" fill="#1e293b">PLANNED</text>
  <text x="390" y="216" text-anchor="middle" class="sm-sub">trip created</text>
  <text x="390" y="232" text-anchor="middle" class="sm-sub">no rounds started</text>
</g>

<!-- PLANNED → IN_PROGRESS -->
<line x1="490" y1="201" x2="620" y2="201" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="555" y="188" text-anchor="middle" class="sm-guard" fill="#374151">first round → IN_PROGRESS</text>
<text x="555" y="204" text-anchor="middle" class="sm-action" fill="#374151">[System auto]</text>

<!-- IN_PROGRESS -->
<g filter="url(#sh)">
  <rect x="620" y="158" width="240" height="86" rx="36" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="740" y="192" text-anchor="middle" class="sm-state" fill="#1e3a8a">IN_PROGRESS</text>
  <text x="740" y="214" text-anchor="middle" class="sm-sub">≥1 round active</text>
  <text x="740" y="232" text-anchor="middle" class="sm-sub">operations ongoing</text>
</g>

<!-- IN_PROGRESS → DONE -->
<line x1="860" y1="201" x2="1000" y2="201" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="930" y="188" text-anchor="middle" class="sm-guard" fill="#374151">all rounds → DONE</text>
<text x="930" y="204" text-anchor="middle" class="sm-action" fill="#374151">[System auto]</text>

<!-- DONE -->
<g filter="url(#sh)">
  <rect x="1000" y="164" width="160" height="74" rx="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1080" y="196" text-anchor="middle" class="sm-state" fill="#14532d">DONE</text>
  <text x="1080" y="216" text-anchor="middle" class="sm-sub">all rounds completed</text>
  <text x="1080" y="232" text-anchor="middle" class="sm-sub">trip closed</text>
</g>

<!-- DONE final dot -->
<circle cx="1060" cy="300" r="10" fill="none" stroke="#1e293b" stroke-width="2.5"/>
<circle cx="1060" cy="300" r="5" fill="#1e293b"/>
<line x1="1080" y1="238" x2="1080" y2="340" stroke="#374151" stroke-width="2"/>
<line x1="1080" y1="340" x2="1060" y2="340" stroke="#374151" stroke-width="2"/>
<line x1="1060" y1="340" x2="1060" y2="310" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

<!-- CANCELLED -->
<g filter="url(#sh)">
  <rect x="620" y="370" width="200" height="68" rx="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="720" y="401" text-anchor="middle" class="sm-state" fill="#991b1b">CANCELLED</text>
  <text x="720" y="421" text-anchor="middle" class="sm-sub">Admin cancels all rounds</text>
</g>

<!-- PLANNED → CANCELLED -->
<line x1="390" y1="238" x2="390" y2="340" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4"/>
<line x1="390" y1="340" x2="620" y2="404" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arr-c)"/>
<text x="460" y="370" class="sm-guard" fill="#dc2626">Admin cancel</text>

<!-- IN_PROGRESS → CANCELLED -->
<line x1="740" y1="244" x2="740" y2="370" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arr-c)"/>
<text x="756" y="314" class="sm-guard" fill="#dc2626">Admin cancel</text>

<!-- CANCELLED final dot -->
<circle cx="900" cy="480" r="10" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="900" cy="480" r="5" fill="#dc2626"/>
<line x1="820" y1="438" x2="820" y2="480" stroke="#dc2626" stroke-width="2"/>
<line x1="820" y1="480" x2="890" y2="480" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-c)"/>

<!-- note box -->
<rect x="80" y="440" width="460" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="100" y="466" class="sm-action" fill="#1d4ed8">status = PLANNED     when: no round started yet</text>
<text x="100" y="486" class="sm-action" fill="#1d4ed8">status = IN_PROGRESS when: first round.status = IN_PROGRESS</text>
<text x="100" y="506" class="sm-action" fill="#1d4ed8">status = DONE        when: ALL rounds.status = DONE</text>
<text x="100" y="526" class="sm-action" fill="#1d4ed8">status = CANCELLED   when: ALL rounds.status = CANCELLED</text>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     SECTION 2 — ROUND STATE MACHINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

<rect x="40" y="600" width="1140" height="540" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="80" y="642" class="section-lbl" fill="#15803d">02  ROUND  —  triggered by BusManager or Admin</text>
<text x="80" y="664" class="sm-sub">BusManager can trigger IN_PROGRESS / DONE on own round · Admin can trigger any state</text>

<!-- Initial -->
<circle cx="160" cy="800" r="14" fill="#1e293b"/>
<line x1="174" y1="800" x2="250" y2="800" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- PLANNED -->
<g filter="url(#sh)">
  <rect x="250" y="764" width="200" height="74" rx="36" fill="white" stroke="#64748b" stroke-width="2.5"/>
  <text x="350" y="796" text-anchor="middle" class="sm-state" fill="#1e293b">PLANNED</text>
  <text x="350" y="818" text-anchor="middle" class="sm-sub">round created</text>
  <text x="350" y="834" text-anchor="middle" class="sm-sub">awaiting departure</text>
</g>

<!-- PLANNED → IN_PROGRESS -->
<line x1="450" y1="801" x2="600" y2="801" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="525" y="784" text-anchor="middle" class="sm-guard" fill="#374151">BusManager / Admin:</text>
<text x="525" y="800" text-anchor="middle" class="sm-guard" fill="#374151">startRound()</text>

<!-- IN_PROGRESS -->
<g filter="url(#sh)">
  <rect x="600" y="756" width="240" height="92" rx="36" fill="#d1fae5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="720" y="790" text-anchor="middle" class="sm-state" fill="#14532d">IN_PROGRESS</text>
  <text x="720" y="812" text-anchor="middle" class="sm-sub">bus departed</text>
  <text x="720" y="830" text-anchor="middle" class="sm-sub">attendance being marked</text>
  <text x="720" y="846" text-anchor="middle" class="sm-sub">MQTT broadcasting active</text>
</g>

<!-- IN_PROGRESS → DONE -->
<line x1="840" y1="801" x2="1000" y2="801" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="920" y="784" text-anchor="middle" class="sm-guard" fill="#374151">BusManager / Admin:</text>
<text x="920" y="800" text-anchor="middle" class="sm-guard" fill="#374151">completeRound()</text>

<!-- DONE -->
<g filter="url(#sh)">
  <rect x="1000" y="764" width="160" height="74" rx="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1080" y="796" text-anchor="middle" class="sm-state" fill="#14532d">DONE</text>
  <text x="1080" y="818" text-anchor="middle" class="sm-sub">all attendance set</text>
  <text x="1080" y="834" text-anchor="middle" class="sm-sub">triggers Trip check</text>
</g>

<!-- DONE → triggers Trip derived state -->
<path d="M1080,838 C 1080,870 1080,880 970,880" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr-cas)"/>
<text x="1000" y="898" class="sm-action" fill="#f59e0b">System: re-evaluate Trip.status</text>

<!-- DONE final -->
<circle cx="1080" cy="960" r="10" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="1080" cy="960" r="5" fill="#16a34a"/>
<line x1="1080" y1="838" x2="1080" y2="1000" stroke="#16a34a" stroke-width="2"/>
<line x1="1080" y1="1000" x2="1080" y2="970" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>

<!-- CANCELLED -->
<g filter="url(#sh)">
  <rect x="600" y="940" width="200" height="74" rx="36" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="700" y="972" text-anchor="middle" class="sm-state" fill="#991b1b">CANCELLED</text>
  <text x="700" y="994" text-anchor="middle" class="sm-sub">round aborted</text>
  <text x="700" y="1010" text-anchor="middle" class="sm-sub">cascade to AttendanceRecords</text>
</g>

<!-- PLANNED → CANCELLED -->
<line x1="350" y1="838" x2="350" y2="977" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4"/>
<line x1="350" y1="977" x2="600" y2="977" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arr-c)"/>
<text x="438" y="965" class="sm-guard" fill="#dc2626">Admin: cancelRound()</text>

<!-- IN_PROGRESS → CANCELLED -->
<line x1="720" y1="848" x2="720" y2="940" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arr-c)"/>
<text x="736" y="898" class="sm-guard" fill="#dc2626">Admin: cancelRound()</text>

<!-- CANCELLED → cascade -->
<line x1="800" y1="977" x2="950" y2="977" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-cas)"/>
<text x="875" y="966" class="sm-action" fill="#f59e0b">System cascade: ALL AttendanceRecord → CANCELLED</text>

<!-- CANCELLED final -->
<circle cx="700" cy="1090" r="10" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="700" cy="1090" r="5" fill="#dc2626"/>
<line x1="700" y1="1014" x2="700" y2="1080" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-c)"/>

<!-- guard note in PLANNED state -->
<rect x="80" y="890" width="440" height="80" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
<text x="100" y="916" class="sm-action" fill="#15803d">Guards enforced by RoundGuard:</text>
<text x="100" y="936" class="sm-action" fill="#15803d">BusManager — only own assigned round</text>
<text x="100" y="956" class="sm-action" fill="#15803d">Admin — any round in tenant scope</text>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     SECTION 3 — ATTENDANCE RECORD STATE MACHINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

<rect x="40" y="1160" width="1140" height="460" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="80" y="1202" class="section-lbl" fill="#c2410c">03  ATTENDANCE RECORD  —  1 record per passenger per round</text>
<text x="80" y="1224" class="sm-sub">BusManager marks · Admin can override at any time · System cascade on Round.CANCELLED</text>

<!-- Initial -->
<circle cx="140" cy="1390" r="14" fill="#1e293b"/>
<line x1="154" y1="1390" x2="240" y2="1390" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- PENDING (implicit — no record yet) -->
<g filter="url(#sh)">
  <rect x="240" y="1356" width="200" height="68" rx="34" fill="white" stroke="#d1d5db" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="340" y="1386" text-anchor="middle" class="sm-state" fill="#6b7280">PENDING</text>
  <text x="340" y="1406" text-anchor="middle" class="sm-sub">no record yet</text>
  <text x="340" y="1420" text-anchor="middle" class="sm-sub">(implicit state)</text>
</g>

<!-- PENDING → JOIN -->
<line x1="440" y1="1370" x2="620" y2="1320" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="530" y="1340" text-anchor="middle" class="sm-guard" fill="#374151">BusManager / Admin:</text>
<text x="530" y="1356" text-anchor="middle" class="sm-guard" fill="#374151">markAttendance(JOIN)</text>

<!-- PENDING → ABSENT -->
<line x1="440" y1="1410" x2="620" y2="1460" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="530" y="1448" text-anchor="middle" class="sm-guard" fill="#374151">BusManager / Admin:</text>
<text x="530" y="1464" text-anchor="middle" class="sm-guard" fill="#374151">markAttendance(ABSENT)</text>

<!-- JOIN -->
<g filter="url(#sh)">
  <rect x="620" y="1282" width="180" height="68" rx="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="710" y="1313" text-anchor="middle" class="sm-state" fill="#14532d">JOIN</text>
  <text x="710" y="1334" text-anchor="middle" class="sm-sub">passenger boarded</text>
  <text x="710" y="1348" text-anchor="middle" class="sm-sub">markedBy: BM/Admin</text>
</g>

<!-- ABSENT -->
<g filter="url(#sh)">
  <rect x="620" y="1430" width="180" height="68" rx="34" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  <text x="710" y="1461" text-anchor="middle" class="sm-state" fill="#854d0e">ABSENT</text>
  <text x="710" y="1482" text-anchor="middle" class="sm-sub">passenger missing</text>
  <text x="710" y="1496" text-anchor="middle" class="sm-sub">markedBy: BM/Admin</text>
</g>

<!-- JOIN ⇄ ABSENT (Admin override) -->
<path d="M800,1310 C 870,1310 870,1480 800,1480" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-ov)"/>
<text x="900" y="1368" class="sm-guard" fill="#9333ea">Admin override:</text>
<text x="900" y="1386" class="sm-guard" fill="#9333ea">changeStatus()</text>
<text x="900" y="1404" class="sm-action" fill="#9333ea">«extend»</text>

<path d="M800,1450 C 860,1450 860,1320 800,1320" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-ov)"/>

<!-- CASCADE to CANCELLED -->
<g filter="url(#sh)">
  <rect x="1040" y="1356" width="200" height="68" rx="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1140" y="1386" text-anchor="middle" class="sm-state" fill="#991b1b">CANCELLED</text>
  <text x="1140" y="1406" text-anchor="middle" class="sm-sub">round cancelled</text>
  <text x="1140" y="1420" text-anchor="middle" class="sm-sub">auto by System</text>
</g>

<!-- JOIN → CANCELLED (cascade) -->
<line x1="800" y1="1316" x2="1040" y2="1380" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-cas)"/>

<!-- ABSENT → CANCELLED (cascade) -->
<line x1="800" y1="1464" x2="1040" y2="1400" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-cas)"/>
